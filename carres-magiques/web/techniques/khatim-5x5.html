<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Khatim 5×5</title>
<style>
  :root{
    --paper:#f2ead9;
    --paper-dark:#e7dcc2;
    --ink:#2b2320;
    --ink-soft:#5b4c3f;
    --line:#8a7457;
    --accent:#8c2f2f;
    --gold:#a9822f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(169,130,47,0.08), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(140,47,47,0.06), transparent 45%);
    color:var(--ink);
    font-family: 'Georgia', 'Amiri', serif;
    min-height:100vh;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 18px 60px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  header h1{
    font-size:1.5rem;
    letter-spacing:0.04em;
    margin:0 0 4px;
    color:var(--ink);
  }
  header .sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    font-style:italic;
  }
  .card{
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
    margin-bottom:20px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 6px 14px rgba(43,35,32,0.08);
  }
  label{
    display:block;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type=number], textarea{
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fbf6ea;
    color:var(--ink);
  }
  textarea{
    resize:vertical;
    min-height:44px;
  }
  .row{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .row > div{flex:1;}
  button{
    width:100%;
    padding:13px;
    font-size:1rem;
    letter-spacing:0.03em;
    background:var(--accent);
    color:#f2ead9;
    border:none;
    border-radius:3px;
    cursor:pointer;
    font-family:inherit;
  }
  button:active{ background:#701f1f; }
  .note{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.4;
  }
  .error{
    color:var(--accent);
    font-size:0.85rem;
    margin-top:8px;
    display:none;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:2px;
    background:var(--line);
    border:2px solid var(--line);
    aspect-ratio:1/1;
  }
  .cell{
    background:#fbf6ea;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2px;
    position:relative;
    min-height:0;
  }
  .cell.center{
    background:#f1e4c6;
  }
  .cell .letter{
    font-size:1.35rem;
    color:var(--gold);
    line-height:1;
  }
  .cell .value{
    font-size:0.72rem;
    color:var(--ink);
    margin-top:3px;
    font-family: 'Courier New', monospace;
  }
  .cell.center .letter{
    font-size:0.62rem;
    color:var(--ink-soft);
  }
  .cell.center .value{
    font-size:0.62rem;
    color:var(--ink);
    word-break:break-word;
    text-align:center;
    padding:0 2px;
  }
  .result-title{
    text-align:center;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  #resultSection{ display:none; }
  .sums{
    margin-top:14px;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<a href="../index.html" id="retour-cm" style="position:sticky;top:0;z-index:50;display:block;background:#1f4e3d;color:#fff;font:600 16px system-ui,-apple-system,Roboto,sans-serif;text-decoration:none;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))">&larr; Retour</a>

<div class="wrap">
  <header>
    <h1>Khatim 5×5</h1>
    <div class="sub">Carré de remplissage — méthode par croisement</div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label for="nombre">Nombre à traiter</label>
        <input type="number" id="nombre" inputmode="numeric" placeholder="ex : 644">
      </div>
    </div>
    <div>
      <label for="besoin">Besoin (inscrit au centre)</label>
      <textarea id="besoin" placeholder="ex : votre demande..."></textarea>
    </div>
    <div class="error" id="errMsg">Veuillez entrer un nombre pair.</div>
    <br>
    <button onclick="calculer()">Remplir le carré</button>
    <div class="note">Calcul : N ÷ 2 − 11 = valeur d'entrée (case خ), puis remplissage automatique des 25 cases.</div>
  </div>

  <div class="card" id="resultSection">
    <div class="result-title">Résultat</div>
    <div class="grid" id="grid" dir="rtl"></div>
    <div class="sums" id="sums"></div>
  </div>
</div>

<script>
// Disposition confirmée du carré 5x5 (ligne par ligne)
const layout = [
  ['ا','ب','ج','د','ه'],
  ['و','ز','ح','ط','ي'],
  ['ك','ل','م','ن','ص'],
  ['ع','ف','ض','ق','ر'],
  ['س','ت','ث','خ','ذ']
];

function calculer(){
  const nInput = document.getElementById('nombre');
  const besoin = document.getElementById('besoin').value.trim();
  const errEl = document.getElementById('errMsg');
  const n = parseFloat(nInput.value);

  if(isNaN(n) || n % 2 !== 0){
    errEl.style.display = 'block';
    document.getElementById('resultSection').style.display = 'none';
    return;
  }
  errEl.style.display = 'none';

  // Etape 1 : calcul de l'entrée
  const entree = (n/2) - 11;

  // Etape 2 : chaine des 8 valeurs de base (incréments fixes)
  const kha = entree;
  const ya  = kha + 4;   // dal
  const ba  = ya  + 5;   // ha
  const ayn = ba  + 1;   // alif
  const ta  = ayn + 2;   // ba
  const waw = ta  + 1;   // alif
  const dal = waw + 5;   // ha
  const ra  = dal + 4;   // dal

  // Etape 3 : les 16 cases croisées
  const values = {
    'خ': kha, 'ي': ya, 'ب': ba, 'ع': ayn, 'ت': ta, 'و': waw, 'د': dal, 'ر': ra,
    'ح': kha+ta, 'ف': kha+waw, 'ص': kha+dal, 'ذ': kha+ra,
    'ق': ya+ta,  'ج': ya+waw,  'ه': ya+dal,  'ل': ya+ra,
    'ك': ba+ta,  'ا': ba+waw,  'ض': ba+dal,  'ط': ba+ra,
    'س': ayn+ta, 'ن': ayn+waw, 'ز': ayn+dal, 'ث': ayn+ra
  };

  // Rendu du grid
  const gridEl = document.getElementById('grid');
  gridEl.innerHTML = '';
  layout.forEach(row => {
    row.forEach(letter => {
      const cell = document.createElement('div');
      if(letter === 'م'){
        cell.className = 'cell center';
        cell.innerHTML = `<div class="letter">م</div><div class="value">${besoin || '—'}</div>`;
      } else {
        cell.className = 'cell';
        cell.innerHTML = `<div class="letter">${letter}</div><div class="value">${values[letter]}</div>`;
      }
      gridEl.appendChild(cell);
    });
  });

  // Sommes de vérification (les 4 "côtés" doivent être égaux)
  const sideSum = values['خ'] + values['ر'] + values['ذ'];
  document.getElementById('sums').textContent =
    `Entrée : ${entree}  •  Somme d'angle : ${values['ب']+values['و']}  •  Vérification : ${sideSum}`;

  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
</body>
</html>
