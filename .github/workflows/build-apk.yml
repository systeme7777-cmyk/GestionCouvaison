name: ANSAR ELEVAGE — tests et APK Android

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      e2e_email:
        description: "E-mail d'un compte administrateur principal de TEST (facultatif : tests sur la vraie base)"
        required: false
        default: ''
      e2e_password:
        description: 'Mot de passe de ce compte de test'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (logique, interface, base réelle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Tests des calculs (stocks, effectifs, finances)
        run: npx vitest run
      - name: Construction de l'application web
        run: npx vite build
      - name: Installation du navigateur de test
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Démarrage du serveur local
        run: |
          npx vite preview --port 4173 &
          npx --yes wait-on@8.0.1 http://localhost:4173/
      - name: Tests d'interface (serveur simulé)
        run: node tests/ui-local.mjs http://localhost:4173/ captures-ui
      - name: Tests de bout en bout sur la vraie base Supabase
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_email != '' }}
        env:
          E2E_EMAIL: ${{ inputs.e2e_email }}
          E2E_PASSWORD: ${{ inputs.e2e_password }}
        run: node tests/e2e-reel.mjs http://localhost:4173/ captures-e2e
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-tests
          path: |
            captures-ui
            captures-e2e
          if-no-files-found: ignore

  apk:
    name: Compilation de l'APK Android
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK Android (préinstallé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - run: npm ci
      - name: Construction web + synchronisation Capacitor
        run: |
          npx vite build
          npx cap sync android
          node scripts/icones.mjs
      - name: Clé de signature privée (si configurée dans les secrets)
        if: ${{ env.HAS_KS == 'true' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Compilation Gradle (APK signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ANSAR-ELEVAGE.apk
      - name: Vérification de l'APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ANSAR-ELEVAGE.apk | head -2
          ls -la ANSAR-ELEVAGE.apk
      - name: APK en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ANSAR-ELEVAGE-apk-v1.0.${{ github.run_number }}
          path: ANSAR-ELEVAGE.apk
      - name: Publication (page « Releases »)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ANSAR ELEVAGE v1.0.${{ github.run_number }}
          make_latest: 'true'
          files: ANSAR-ELEVAGE.apk
          body: |
            Application Android **ANSAR ELEVAGE — Gestion Avicole**.

            Installation : téléchargez `ANSAR-ELEVAGE.apk` sur le téléphone Android, ouvrez-le et autorisez l'installation.
            Les mises à jour s'installent par-dessus la version précédente sans perdre les données.
