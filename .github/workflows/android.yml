name: ANSAROUDINE ZIKR - Tests et APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  base-de-donnees:
    name: Tests de la base de données (sécurité RLS, décomptes, charge)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Préparation
        run: psql -v ON_ERROR_STOP=1 -c 'create database zk'
      - name: Migration
        run: psql -d zk -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql -f supabase/migrations/20261121000001_schema.sql
      - name: Migration rejouable
        run: psql -d zk -v ON_ERROR_STOP=1 -f supabase/migrations/20261121000001_schema.sql
      - name: Tests fonctionnels et de sécurité
        run: psql -d zk -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests.sql | tee resultat.txt && grep -q "TOUS LES TESTS SONT PASSÉS" resultat.txt

  bout-en-bout:
    name: Test de bout en bout (Supabase complet)
    runs-on: ubuntu-latest
    needs: base-de-donnees
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Démarrage de Supabase
        run: supabase start -x studio,storage-api,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta
      - name: Fonction Edge
        run: |
          nohup supabase functions serve --no-verify-jwt > functions.log 2>&1 &
          sleep 15
      - name: Scénario complet
        run: |
          export SUPABASE_URL=http://127.0.0.1:54321
          export SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)
          node supabase/tests/e2e.mjs

  application:
    name: Tests unitaires et APK Android
    runs-on: ubuntu-latest
    needs: [base-de-donnees, bout-en-bout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Signature (si les secrets sont configurés)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZIKR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "ZIKR_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          fi
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Construction de l'APK
        env:
          ZIKR_KEYSTORE_PASSWORD: ${{ secrets.ZIKR_KEYSTORE_PASSWORD }}
          ZIKR_KEY_ALIAS: ${{ secrets.ZIKR_KEY_ALIAS }}
          ZIKR_KEY_PASSWORD: ${{ secrets.ZIKR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ansaroudine-zikr-apk
          path: app/build/outputs/apk/release/*.apk
